<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - BrandName</title>
  <meta name="description" content="Sign in to your BrandName account using Google or Apple.">

  <!-- Google Fonts Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./style.css">

  <!-- Self-Contained Complete Centering & Gradient Styles (Immune to GitHub Pages subpath/asset issues) -->
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Dead-center full viewport alignment with rich aurora mesh gradient */
    body.auth-page-body {
      margin: 0;
      padding: 1.5rem 1rem;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      background-color: #07090e;
      background-image:
        radial-gradient(ellipse 90% 70% at 50% -15%, rgba(99, 102, 241, 0.32), transparent 70%),
        radial-gradient(ellipse 60% 50% at 95% 85%, rgba(168, 85, 247, 0.22), transparent 60%),
        radial-gradient(ellipse 50% 50% at 5% 90%, rgba(59, 130, 246, 0.2), transparent 60%),
        radial-gradient(ellipse 80% 40% at 50% 115%, rgba(236, 72, 153, 0.14), transparent 70%),
        linear-gradient(180deg, #070a12 0%, #0d1322 100%);
      background-attachment: fixed;
      background-size: cover;
      color: #f8fafc;
      position: relative;
      overflow-x: hidden;
      box-sizing: border-box;
    }

    /* Ambient atmospheric glow behind the card */
    .auth-glow-backdrop {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(540px, 90vw);
      height: min(540px, 90vw);
      background: radial-gradient(circle, rgba(99, 102, 241, 0.18) 0%, rgba(168, 85, 247, 0.1) 45%, transparent 70%);
      filter: blur(75px);
      pointer-events: none;
      z-index: 0;
    }

    /* Centered main container */
    .auth-main-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 430px;
      margin: auto !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      box-sizing: border-box;
    }

    /* Glassmorphic authentication card */
    .auth-card {
      width: 100%;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 2.75rem 2.25rem 2.25rem;
      box-shadow:
        0 25px 50px -12px rgba(0, 0, 0, 0.75),
        0 0 0 1px rgba(255, 255, 255, 0.05),
        inset 0 1px 1px rgba(255, 255, 255, 0.15);
      text-align: center;
      box-sizing: border-box;
      animation: authCardFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes authCardFadeIn {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .auth-brand-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.25), rgba(168, 85, 247, 0.25));
      border: 1px solid rgba(99, 102, 241, 0.45);
      color: #818cf8;
      font-size: 1.65rem;
      margin-bottom: 0.9rem;
      box-shadow: 0 8px 20px -4px rgba(99, 102, 241, 0.3);
    }

    .auth-brand-label {
      font-family: 'Space Grotesk', -apple-system, sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    .auth-title {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      font-size: 1.45rem;
      font-weight: 700;
      color: #ffffff;
      margin: 0 0 0.4rem 0;
      letter-spacing: -0.02em;
    }

    .auth-subtitle {
      font-size: 0.92rem;
      color: #94a3b8;
      line-height: 1.5;
      margin: 0 0 1.75rem 0;
    }

    /* Alert Banner */
    .auth-alert {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      margin-bottom: 1.5rem;
      font-size: 0.88rem;
      text-align: left;
      line-height: 1.4;
      box-sizing: border-box;
      animation: authAlertFade 0.2s ease-out;
    }

    @keyframes authAlertFade {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-alert-error {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #f87171;
    }

    .auth-alert-success {
      background-color: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
    }

    .auth-alert-icon {
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }

    .auth-alert-text {
      flex: 1 1 auto;
    }

    /* Provider Buttons Stack */
    .auth-providers-list {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      margin-bottom: 1.75rem;
      width: 100%;
    }

    .auth-provider-slot {
      position: relative;
      width: 100%;
    }

    .google-btn-slot {
      display: none;
      width: 100%;
      min-height: 48px;
    }

    .btn-auth-provider {
      position: relative;
      width: 100%;
      height: 50px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.96rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.85rem;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      outline: none;
      box-sizing: border-box;
      text-decoration: none;
      user-select: none;
      border: 1px solid transparent;
    }

    .btn-auth-provider .provider-icon {
      flex-shrink: 0;
    }

    .btn-auth-provider .btn-text {
      flex-grow: 0;
      letter-spacing: -0.01em;
    }

    /* Google Button */
    .btn-google {
      background-color: #ffffff;
      color: #1e293b;
      border-color: rgba(255, 255, 255, 0.85);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }

    .btn-google:hover {
      background-color: #f8fafc;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
    }

    .btn-google:active {
      transform: translateY(0);
    }

    /* Apple Button */
    .btn-apple {
      background-color: #000000;
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.22);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    .btn-apple:hover {
      background-color: #111827;
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
    }

    .btn-apple:active {
      transform: translateY(0);
    }

    /* Loading Spinner */
    .auth-spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: authSpin 0.7s linear infinite;
      margin-left: 4px;
    }

    @keyframes authSpin {
      to { transform: rotate(360deg); }
    }

    .btn-auth-provider.loading .auth-spinner {
      display: inline-block;
    }

    .btn-auth-provider.loading {
      pointer-events: none;
      opacity: 0.8;
    }

    .auth-card-footer {
      padding-top: 1.25rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .auth-security-note {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.82rem;
      color: #64748b;
      margin: 0;
    }

    .auth-security-note svg {
      color: #818cf8;
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: 2.25rem 1.5rem 1.75rem;
        border-radius: 20px;
      }
      .auth-title {
        font-size: 1.35rem;
      }
    }
  </style>

  <!-- External OAuth SDKs -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="text/javascript" src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/auth.js"></script>

  <!-- Centralized Auth Scripts -->
  <script src="./auth-config.js"></script>
  <script src="./auth.js"></script>
</head>
<body class="auth-page-body">

  <!-- Ambient Glow Backdrop -->
  <div class="auth-glow-backdrop" aria-hidden="true"></div>

  <!-- Perfectly Centered Authentication Card (No separate header, No theme toggle) -->
  <main class="auth-main-wrapper">
    <div class="auth-card">
      <div class="auth-card-header">
        <div class="auth-brand-badge">
          <span class="brand-symbol">◈</span>
        </div>
        <div class="auth-brand-label">BrandName</div>
        <h1 class="auth-title">Welcome to BrandName</h1>
        <p class="auth-subtitle">Sign in to access your account and explore the website.</p>
      </div>

      <!-- Feedback / Alert Notification -->
      <div class="auth-alert" id="auth-alert" role="alert" style="display: none;">
        <span class="auth-alert-icon" id="auth-alert-icon"></span>
        <span class="auth-alert-text" id="auth-alert-text"></span>
      </div>

      <!-- Authentication Providers (ONLY Google & Apple) -->
      <div class="auth-providers-list">
        <!-- 1. Continue with Google -->
        <div class="auth-provider-slot">
          <!-- Official Google Identity Services Container -->
          <div id="google-signin-btn-container" class="google-btn-slot"></div>
          <!-- Interactive Google Button -->
          <button type="button" class="btn-auth-provider btn-google" id="btn-google-trigger" aria-label="Continue with Google">
            <svg class="provider-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span class="btn-text">Continue with Google</span>
            <span class="auth-spinner" aria-hidden="true"></span>
          </button>
        </div>

        <!-- 2. Continue with Apple -->
        <div class="auth-provider-slot">
          <button type="button" class="btn-auth-provider btn-apple" id="btn-apple-trigger" aria-label="Continue with Apple">
            <svg class="provider-icon" viewBox="0 0 170 170" width="20" height="20" fill="currentColor" aria-hidden="true">
              <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.42-6.08-3.7-3.04-7.58-7.7-11.64-13.99-5.99-9.35-10.66-20.08-14.01-32.18-3.35-12.1-5.03-23.36-5.03-33.77 0-14.13 3.41-26.04 10.23-35.73 6.82-9.69 15.53-14.65 26.13-14.88 4.25 0 9.29 1.16 15.13 3.48 5.84 2.32 9.53 3.54 11.07 3.65 1.91-.22 5.84-1.55 11.8-3.99 5.96-2.44 11.06-3.53 15.3-3.27 13.92 1.09 24.58 6.47 31.98 16.14-12.19 7.4-18.17 17.51-17.94 30.34.22 10.01 4.09 18.39 11.61 25.13 7.52 6.74 16.48 10.55 26.88 11.43-2.39 7.08-5.11 14.37-8.15 21.87zM119.22 31.84c0-7.72 2.76-14.92 8.28-21.6 5.53-6.68 12.37-10.24 20.53-10.24.22 1.09.33 2.07.33 2.94 0 7.62-2.88 15.02-8.63 22.21-5.75 7.18-12.7 10.97-20.86 11.36-.11-1.31-.16-2.31-.16-3.01z"/>
            </svg>
            <span class="btn-text">Continue with Apple</span>
            <span class="auth-spinner" aria-hidden="true"></span>
          </button>
        </div>
      </div>

      <!-- Auth Footnote -->
      <div class="auth-card-footer">
        <p class="auth-security-note">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <span>Protected by official OAuth verification</span>
        </p>
      </div>
    </div>
  </main>

  <!-- Auth Controller Initialization -->
  <script>
    (function() {
      // 1. If already authenticated, redirect to destination immediately
      if (window.AuthManager && window.AuthManager.isAuthenticated()) {
        const dest = window.AuthManager.getRedirectTarget();
        window.location.replace(dest);
        return;
      }

      const alertBox = document.getElementById('auth-alert');
      const alertIcon = document.getElementById('auth-alert-icon');
      const alertText = document.getElementById('auth-alert-text');
      const googleBtn = document.getElementById('btn-google-trigger');
      const appleBtn = document.getElementById('btn-apple-trigger');

      function showAlert(type, message) {
        if (!alertBox) return;
        alertBox.className = 'auth-alert auth-alert-' + type;
        alertBox.style.display = 'flex';
        alertText.textContent = message;
        if (type === 'error') {
          alertIcon.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>';
        } else if (type === 'success') {
          alertIcon.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
        } else {
          alertIcon.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>';
        }
      }

      function hideAlert() {
        if (alertBox) alertBox.style.display = 'none';
      }

      // 2. Initialize Google Identity Services
      if (window.AuthManager && typeof window.AuthManager.initGoogleAuth === 'function') {
        window.AuthManager.initGoogleAuth({
          onSuccess: function(user) {
            showAlert('success', 'Authenticated with Google. Loading portal...');
            setTimeout(function() {
              window.location.replace(window.AuthManager.getRedirectTarget());
            }, 300);
          },
          onError: function(err) {
            if (googleBtn) googleBtn.classList.remove('loading');
            showAlert('error', err.message || 'Google authentication could not be completed.');
          }
        });
      }

      if (googleBtn) {
        googleBtn.addEventListener('click', function() {
          hideAlert();
          googleBtn.classList.add('loading');
          window.AuthManager.triggerGooglePrompt({
            onSuccess: function(user) {
              showAlert('success', 'Authenticated with Google. Loading portal...');
              setTimeout(function() {
                window.location.replace(window.AuthManager.getRedirectTarget());
              }, 300);
            },
            onError: function(err) {
              googleBtn.classList.remove('loading');
              showAlert('error', err.message || 'Google authentication could not be completed.');
            }
          });
          setTimeout(function() {
            googleBtn.classList.remove('loading');
          }, 4000);
        });
      }

      // 3. Initialize Apple Sign-In
      if (window.AuthManager && typeof window.AuthManager.initAppleAuth === 'function') {
        window.AuthManager.initAppleAuth({
          onError: function(err) {
            console.warn('Apple auth init:', err);
          }
        });
      }

      if (appleBtn) {
        appleBtn.addEventListener('click', function() {
          hideAlert();
          appleBtn.classList.add('loading');
          window.AuthManager.signInWithApple({
            onSuccess: function(user) {
              showAlert('success', 'Authenticated with Apple. Loading portal...');
              setTimeout(function() {
                window.location.replace(window.AuthManager.getRedirectTarget());
              }, 300);
            },
            onError: function(err) {
              appleBtn.classList.remove('loading');
              showAlert('error', err.message || 'Apple authentication could not be completed.');
            }
          });
        });
      }
    })();
  </script>
</body>
</html>
