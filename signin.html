<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - BrandName</title>
  <meta name="description" content="Sign in to your BrandName account using Google or Apple.">

  <!-- Google Fonts Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./style.css">

  <!-- Self-Contained Unified Styles for Desktop, Laptop & Mobile (Immune to GitHub Pages subpath/asset issues) -->
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Full Viewport Responsive Flex Container */
    body.auth-page-body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex !important;
      flex-direction: column !important;
      justify-content: space-between !important;
      align-items: center !important;
      background-color: #06080e;
      color: #f8fafc;
      position: relative;
      overflow-x: hidden;
      box-sizing: border-box;
    }

    /* 
     * HARDWARE-ACCELERATED ANIMATED GRADIENT (SILKY 60FPS / 120HZ ON MOBILE)
     * Animates ONLY GPU-composited transform properties (translate3d & scale).
     * Never triggers repaint or reflow, ensuring zero lag or battery drain on mobile.
     */
    .aurora-ambient-wrap {
      position: fixed;
      inset: -20px;
      width: calc(100% + 40px);
      height: calc(100% + 40px);
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
      contain: strict;
      transform: translate3d(0, 0, 0);
    }

    .aurora-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(65px);
      -webkit-filter: blur(65px);
      opacity: 0.62;
      will-change: transform;
      transform: translate3d(0, 0, 0);
      mix-blend-mode: screen;
    }

    .orb-1 {
      top: -10%;
      left: 15%;
      width: min(520px, 85vw);
      height: min(480px, 85vw);
      background: radial-gradient(circle, rgba(99, 102, 241, 0.48) 0%, rgba(79, 70, 229, 0.22) 55%, transparent 75%);
      animation: auroraFloat1 20s ease-in-out infinite alternate;
    }

    .orb-2 {
      bottom: -15%;
      right: 5%;
      width: min(500px, 80vw);
      height: min(460px, 80vw);
      background: radial-gradient(circle, rgba(168, 85, 247, 0.42) 0%, rgba(147, 51, 234, 0.2) 55%, transparent 75%);
      animation: auroraFloat2 24s ease-in-out infinite alternate;
    }

    .orb-3 {
      top: 35%;
      left: -8%;
      width: min(450px, 75vw);
      height: min(430px, 75vw);
      background: radial-gradient(circle, rgba(59, 130, 246, 0.38) 0%, rgba(37, 99, 235, 0.18) 55%, transparent 75%);
      animation: auroraFloat3 22s ease-in-out infinite alternate;
    }

    .orb-4 {
      bottom: -10%;
      left: 25%;
      width: min(440px, 75vw);
      height: min(410px, 75vw);
      background: radial-gradient(circle, rgba(236, 72, 153, 0.3) 0%, rgba(219, 39, 119, 0.14) 55%, transparent 75%);
      animation: auroraFloat4 26s ease-in-out infinite alternate;
    }

    @keyframes auroraFloat1 {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(55px, 45px, 0) scale(1.12); }
      100% { transform: translate3d(-35px, 75px, 0) scale(0.96); }
    }

    @keyframes auroraFloat2 {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(-65px, -45px, 0) scale(1.14); }
      100% { transform: translate3d(30px, -70px, 0) scale(0.94); }
    }

    @keyframes auroraFloat3 {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(45px, -55px, 0) scale(1.08); }
      100% { transform: translate3d(-25px, 35px, 0) scale(0.96); }
    }

    @keyframes auroraFloat4 {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(-50px, -35px, 0) scale(1.1); }
      100% { transform: translate3d(45px, -25px, 0) scale(0.95); }
    }

    /* Mobile optimization: lower blur cost for ultra-smooth 60fps / 120Hz */
    @media (max-width: 768px) {
      .aurora-orb {
        filter: blur(42px);
        -webkit-filter: blur(42px);
        opacity: 0.58;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .aurora-orb {
        animation: none !important;
      }
    }

    /* Top Bar Navigation: Document Flow (Prevents Any Card Overlap) */
    .auth-top-bar {
      width: 100%;
      position: relative;
      z-index: 10;
      padding: 1.25rem 2rem;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    .auth-top-bar-inner {
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .auth-brand-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: #ffffff;
      font-family: 'Space Grotesk', -apple-system, sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      transition: opacity 0.2s ease;
      user-select: none;
    }

    .auth-brand-link:hover {
      opacity: 0.85;
    }

    .auth-brand-symbol {
      color: #818cf8;
      font-size: 1.35rem;
      line-height: 1;
    }

    /* Bold Luminous White Button: Opposite of Black */
    .btn-continue-guest {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.65rem 1.35rem;
      background: rgba(255, 255, 255, 0.18);
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      border-radius: 9999px;
      color: #ffffff;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      text-decoration: none;
      cursor: pointer;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.18), 0 0 12px rgba(255, 255, 255, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.5);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
      white-space: nowrap;
    }

    .btn-continue-guest span {
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.7);
    }

    .btn-continue-guest:hover {
      background: rgba(255, 255, 255, 0.3);
      border-color: #ffffff;
      color: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 6px 25px rgba(255, 255, 255, 0.35), 0 0 20px rgba(255, 255, 255, 0.3);
    }

    .btn-continue-guest:active {
      transform: translateY(0);
    }

    .btn-continue-guest svg {
      transition: transform 0.2s ease;
      flex-shrink: 0;
      color: #ffffff;
    }

    .btn-continue-guest:hover svg {
      transform: translateX(3px);
    }

    /* Ambient atmospheric glow behind the card */
    .auth-glow-backdrop {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(540px, 90vw);
      height: min(540px, 90vw);
      background: radial-gradient(circle, rgba(99, 102, 241, 0.2) 0%, rgba(168, 85, 247, 0.12) 45%, transparent 70%);
      filter: blur(75px);
      pointer-events: none;
      z-index: 0;
    }

    /* Main Container: Centered Alignment */
    .auth-main-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      margin: auto !important;
      padding: 1.5rem 1.25rem 2.5rem;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      box-sizing: border-box;
      flex: 1 1 auto;
    }

    /* Glassmorphic authentication card */
    .auth-card {
      width: 100%;
      background: rgba(15, 23, 42, 0.84);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 24px;
      padding: 2.75rem 2.25rem 2rem;
      box-shadow:
        0 25px 50px -12px rgba(0, 0, 0, 0.8),
        0 0 0 1px rgba(255, 255, 255, 0.06),
        inset 0 1px 1px rgba(255, 255, 255, 0.18);
      text-align: center;
      box-sizing: border-box;
      animation: authCardFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes authCardFadeIn {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .auth-brand-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.28), rgba(168, 85, 247, 0.28));
      border: 1px solid rgba(99, 102, 241, 0.5);
      color: #818cf8;
      font-size: 1.65rem;
      margin-bottom: 0.9rem;
      box-shadow: 0 8px 20px -4px rgba(99, 102, 241, 0.35);
    }

    .auth-brand-label {
      font-family: 'Space Grotesk', -apple-system, sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
    }

    .auth-title {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      font-size: 1.45rem;
      font-weight: 700;
      color: #ffffff;
      margin: 0 0 0.4rem 0;
      letter-spacing: -0.02em;
    }

    .auth-subtitle {
      font-size: 0.92rem;
      color: #94a3b8;
      line-height: 1.5;
      margin: 0 0 1.75rem 0;
    }

    /* Alert Banner */
    .auth-alert {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      margin-bottom: 1.5rem;
      font-size: 0.88rem;
      text-align: left;
      line-height: 1.4;
      box-sizing: border-box;
      animation: authAlertFade 0.2s ease-out;
    }

    @keyframes authAlertFade {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-alert-error {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #f87171;
    }

    .auth-alert-success {
      background-color: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
    }

    .auth-alert-icon {
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }

    .auth-alert-text {
      flex: 1 1 auto;
    }

    /* Provider Buttons Stack */
    .auth-providers-list {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      margin-bottom: 1.25rem;
      width: 100%;
    }

    .auth-provider-slot {
      position: relative;
      width: 100%;
    }

    .google-btn-slot {
      display: none;
      width: 100%;
      min-height: 48px;
    }

    .btn-auth-provider {
      position: relative;
      width: 100%;
      height: 50px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.96rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.85rem;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      outline: none;
      box-sizing: border-box;
      text-decoration: none;
      user-select: none;
      border: 1px solid transparent;
    }

    .btn-auth-provider .provider-icon {
      flex-shrink: 0;
    }

    .btn-auth-provider .btn-text {
      flex-grow: 0;
      letter-spacing: -0.01em;
    }

    /* Google Button */
    .btn-google {
      background-color: #ffffff;
      color: #1e293b;
      border-color: rgba(255, 255, 255, 0.85);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }

    .btn-google:hover {
      background-color: #f8fafc;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
    }

    .btn-google:active {
      transform: translateY(0);
    }

    /* Apple Button */
    .btn-apple {
      background-color: #000000;
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.22);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    .btn-apple:hover {
      background-color: #111827;
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
    }

    .btn-apple:active {
      transform: translateY(0);
    }

    /* Loading Spinner */
    .auth-spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: authSpin 0.7s linear infinite;
      margin-left: 4px;
    }

    @keyframes authSpin {
      to { transform: rotate(360deg); }
    }

    .btn-auth-provider.loading .auth-spinner {
      display: inline-block;
    }

    .btn-auth-provider.loading {
      pointer-events: none;
      opacity: 0.8;
    }

    /* Inline Guest Fallback */
    .auth-card-guest-option {
      margin-top: 1rem;
      padding-top: 1.15rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.86rem;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      flex-wrap: wrap;
    }

    .link-inline-guest {
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
      font-size: inherit;
      font-weight: 700;
      color: #38bdf8;
      cursor: pointer;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .link-inline-guest:hover {
      color: #7dd3fc;
      text-decoration: underline;
    }

    /* Security Note Footer */
    .auth-card-footer {
      padding-top: 1.15rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      margin-top: 1rem;
    }

    .auth-security-note {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.82rem;
      color: #64748b;
      margin: 0;
    }

    .auth-security-note svg {
      color: #818cf8;
    }

    /* Mobile Responsive Precision Adjustments */
    @media (max-width: 640px) {
      .auth-top-bar {
        padding: 0.85rem 1.15rem;
      }
      .auth-brand-link {
        font-size: 1.15rem;
      }
      .btn-continue-guest {
        padding: 0.5rem 1rem;
        font-size: 0.82rem;
        font-weight: 800;
        gap: 0.35rem;
      }
      .auth-main-wrapper {
        padding: 0.5rem 1rem 1.75rem;
      }
      .auth-card {
        padding: 1.85rem 1.25rem 1.5rem;
        border-radius: 20px;
      }
      .auth-brand-badge {
        width: 46px;
        height: 46px;
        font-size: 1.35rem;
        margin-bottom: 0.75rem;
      }
      .auth-title {
        font-size: 1.35rem;
        line-height: 1.25;
      }
      .auth-subtitle {
        font-size: 0.86rem;
      }
      .btn-auth-provider {
        height: 48px;
        font-size: 0.92rem;
      }
    }
  </style>

  <!-- External OAuth SDKs -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="text/javascript" src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/auth.js"></script>

  <!-- Centralized Auth Scripts -->
  <script src="./auth-config.js"></script>
  <script src="./auth.js"></script>
</head>
<body class="auth-page-body">

  <!-- SILKY GPU-ACCELERATED ANIMATED GRADIENT BACKGROUND -->
  <div class="aurora-ambient-wrap" aria-hidden="true">
    <div class="aurora-orb orb-1"></div>
    <div class="aurora-orb orb-2"></div>
    <div class="aurora-orb orb-3"></div>
    <div class="aurora-orb orb-4"></div>
  </div>

  <!-- Ambient Glow Backdrop -->
  <div class="auth-glow-backdrop" aria-hidden="true"></div>

  <!-- Top Bar Navigation: Document Flow (Prevents Any Overlap) -->
  <header class="auth-top-bar" aria-label="Sign In Navigation">
    <div class="auth-top-bar-inner">
      <a href="index.html" class="auth-brand-link" id="auth-top-brand" aria-label="Return to BrandName homepage">
        <span class="auth-brand-symbol">◈</span>
        <span class="auth-brand-title">BrandName</span>
      </a>

      <button type="button" class="btn-continue-guest" id="btn-skip-auth" aria-label="Continue as a guest">
        <span>Continue as a guest</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14"></path>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </div>
  </header>

  <!-- Perfectly Centered Authentication Card (Looks Great on Desktop, Laptop & Mobile) -->
  <main class="auth-main-wrapper">
    <div class="auth-card">
      <div class="auth-card-header">
        <div class="auth-brand-badge" aria-hidden="true">
          <span class="brand-symbol">◈</span>
        </div>
        <div class="auth-brand-label">BrandName</div>
        <h1 class="auth-title">Welcome to BrandName</h1>
        <p class="auth-subtitle">Sign in to access your account, saved preferences, and workspaces.</p>
      </div>

      <!-- Feedback / Alert Notification -->
      <div class="auth-alert" id="auth-alert" role="alert" style="display: none;">
        <span class="auth-alert-icon" id="auth-alert-icon"></span>
        <span class="auth-alert-text" id="auth-alert-text"></span>
      </div>

      <!-- Authentication Providers (Google & Apple) -->
      <div class="auth-providers-list">
        <!-- 1. Continue with Google -->
        <div class="auth-provider-slot">
          <!-- Official Google Identity Services Container -->
          <div id="google-signin-btn-container" class="google-btn-slot"></div>
          <!-- Interactive Google Button -->
          <button type="button" class="btn-auth-provider btn-google" id="btn-google-trigger" aria-label="Continue with Google">

              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span class="btn-text">Continue with Google</span>
            <span class="auth-spinner" aria-hidden="true"></span>
          </button>
        </div>

        <!-- 2. Continue with Apple -->
        <div class="auth-provider-slot">
          <button type="button" class="btn-auth-provider btn-apple" id="btn-apple-trigger" aria-label="Continue with Apple">

            </svg>
            <span class="btn-text">Continue with Apple</span>
            <span class="auth-spinner" aria-hidden="true"></span>
          </button>
        </div>
      </div>

      <!-- Secondary Inline Guest Access Option -->
      <div class="auth-card-guest-option">
        <span>Exploring without an account?</span>
        <button type="button" class="link-inline-guest" id="link-inline-guest">Continue as a guest &rarr;</button>
      </div>

      <!-- Auth Footnote -->
      <div class="auth-card-footer">
        <p class="auth-security-note">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <span>Protected by official OAuth verification</span>
        </p>
      </div>
    </div>
  </main>

  <!-- Auth Controller Initialization -->
  <script>
    (function() {
      // 1. If already authenticated as full member, redirect to destination
      if (window.AuthManager && window.AuthManager.isAuthenticated()) {
        const dest = window.AuthManager.getRedirectTarget();
        window.location.replace(dest);
        return;
      }

      const alertBox = document.getElementById('auth-alert');
      const alertIcon = document.getElementById('auth-alert-icon');
      const alertText = document.getElementById('auth-alert-text');
      const googleBtn = document.getElementById('btn-google-trigger');
      const appleBtn = document.getElementById('btn-apple-trigger');
      const skipBtn = document.getElementById('btn-skip-auth');
      const inlineGuestBtn = document.getElementById('link-inline-guest');
      const topBrandBtn = document.getElementById('auth-top-brand');

      // Shared Guest Navigation Handler
      function handleGuestNavigation(e) {
        if (e) e.preventDefault();
        if (window.AuthManager && typeof window.AuthManager.enableGuestAccess === 'function') {
          window.AuthManager.enableGuestAccess();
        } else {
          localStorage.setItem('brandname_guest_access', 'true');
        }
        const target = (window.AuthManager && window.AuthManager.getRedirectTarget()) || 'index.html';
        window.location.replace(target);
      }

      if (skipBtn) skipBtn.addEventListener('click', handleGuestNavigation);
      if (inlineGuestBtn) inlineGuestBtn.addEventListener('click', handleGuestNavigation);
      if (topBrandBtn) topBrandBtn.addEventListener('click', handleGuestNavigation);

      function showAlert(type, message) {
        if (!alertBox) return;
        alertBox.className = 'auth-alert auth-alert-' + type;
        alertBox.style.display = 'flex';
        alertText.textContent = message;
        if (type === 'error') {
          alertIcon.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>';
        } else if (type === 'success') {
          alertIcon.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
        } else {
          alertIcon.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="8"></line></svg>';
        }
      }

      function hideAlert() {
        if (alertBox) alertBox.style.display = 'none';
      }

      // 2. Initialize Google Identity Services
      if (window.AuthManager && typeof window.AuthManager.initGoogleAuth === 'function') {
        window.AuthManager.initGoogleAuth({
          onSuccess: function(user) {
            showAlert('success', 'Authenticated with Google. Loading portal...');
            setTimeout(function() {
              window.location.replace(window.AuthManager.getRedirectTarget());
            }, 300);
          },
          onError: function(err) {
            if (googleBtn) googleBtn.classList.remove('loading');
            showAlert('error', err.message || 'Google authentication could not be completed.');
          }
        });
      }

      if (googleBtn) {
        googleBtn.addEventListener('click', function() {
          hideAlert();
          googleBtn.classList.add('loading');
          window.AuthManager.triggerGooglePrompt({
            onSuccess: function(user) {
              showAlert('success', 'Authenticated with Google. Loading portal...');
              setTimeout(function() {
                window.location.replace(window.AuthManager.getRedirectTarget());
              }, 300);
            },
            onError: function(err) {
              googleBtn.classList.remove('loading');
              showAlert('error', err.message || 'Google authentication could not be completed.');
            }
          });
          setTimeout(function() {
            googleBtn.classList.remove('loading');
          }, 4000);
        });
      }

      // 3. Initialize Apple Sign-In
      if (window.AuthManager && typeof window.AuthManager.initAppleAuth === 'function') {
        window.AuthManager.initAppleAuth({
          onError: function(err) {
            console.warn('Apple auth init:', err);
          }
        });
      }

      if (appleBtn) {
        appleBtn.addEventListener('click', function() {
          hideAlert();
          appleBtn.classList.add('loading');
          window.AuthManager.signInWithApple({
            onSuccess: function(user) {
              showAlert('success', 'Authenticated with Apple. Loading portal...');
              setTimeout(function() {
                window.location.replace(window.AuthManager.getRedirectTarget());
              }, 300);
            },
            onError: function(err) {
              appleBtn.classList.remove('loading');
              showAlert('error', err.message || 'Apple authentication could not be completed.');
            }
          });
        });
      }
    })();
  </script>
</body>
</html>
